name: Build APK

# ============================================================
# 谛听（Diting）自动构建工作流
# ------------------------------------------------------------
# 触发方式：
#   1. 推送到 main / master 分支时自动构建
#   2. 在 Actions 页面手动触发（workflow_dispatch）
#   3. 推送 v* 标签时自动创建 Release 并附带 APK
#
# 产物：
#   - 每次构建：可在 Actions 页面下载 Artifacts（保留 30 天）
#   - 打标签时：自动生成 GitHub Release，附带 APK
# ============================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 允许工作流创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. 配置 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------- 3. 配置 Android SDK ----------
      # 说明：SDK 版本与 gradle.properties 的 sdkVersion 保持一致。
      # 若调整 sdkVersion，请同步修改此处（默认 35）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      # ---------- 4. 缓存 Gradle ----------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- 5. 解码签名密钥（从 Secrets） ----------
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/diting-release.jks
          cat > keystore.properties <<EOF
          storeFile=diting-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ---------- 6. 赋予 gradlew 执行权限 ----------
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---------- 7. 构建 Release APK ----------
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ---------- 8. 重命名 APK（带版本号） ----------
      - name: Rename APK
        id: rename
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "未找到 release APK" >&2
            exit 1
          fi
          # 从 app/build.gradle 提取 versionName（兼容单/双引号）
          VERSION=$(sed -n "s/.*versionName[[:space:]=]*[\"']\([^\"']*\)[\"'].*/\1/p" app/build.gradle | head -1)
          VERSION=${VERSION:-1.0.0}
          OUT="Diting-v${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          echo "APK: $OUT ($(du -h "$OUT" | cut -f1))"

      # ---------- 9. 上传构建产物（Actions 页面可下载） ----------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diting-APK
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

      # ---------- 10. 打标签时自动创建 Release ----------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Diting ${{ github.ref_name }}
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
