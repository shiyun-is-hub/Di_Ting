plugins { 
    id 'com.android.application' 
    id 'org.jetbrains.kotlin.android' version '1.9.22'
    id("io.gitlab.arturbosch.detekt").version("1.23.1")
}

// [正式签名] 从 keystore.properties 读取密钥库信息（缺失时回退 debug 签名）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file('app/' + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    namespace 'com.diting.recorder'
    // [构建环境适配] compileSdk / targetSdk 由 gradle.properties 控制：
    // 默认 35（云端 x86_64 环境，满足应用商店上架要求）；
    // 本地 arm64 环境因缺少新版 aapt2，可在 gradle.properties 中
    // 设置 sdkVersion=34 进行本地调试构建。
    def sdkVer = (project.findProperty("sdkVersion") ?: "35").toInteger()
    compileSdk sdkVer

    // [修复] 强制对齐 Java 与 Kotlin 的底层字节码版本
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    // NDK 路径推荐在 local.properties 中配置 ndk.dir，以下为 RV2IDE 环境示例
    // ndkPath "/data/user/0/com.tom.rv2ide/files/home/android-sdk/ndk/29.0.14033849"
    // [本地 aarch64测试构建]无官方 aarch64 NDK，native库使用同源预编译注入

    defaultConfig {
        applicationId 'com.diting.recorder'
        minSdk 26
        targetSdk sdkVer
        versionCode 2
        versionName "1.1.1"
        resourceConfigurations += ["zh", "en"]
        
        // [本地测试构建]已禁用 C++构建块（改用 jniLibs注入同源 so）
    }

    // CMake 版本按本地环境调整，RV2IDE 环境示例值为 3.31.6+
    // [本地测试构建]已禁用 C++构建块（改用 jniLibs注入同源 so）

    // [体积优化] release 开启 R8 代码压缩 + 资源压缩；签名复用 debug（可原地覆盖安装）
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // [正式签名] 使用 release 正式签名（keystore.properties）
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // [体积优化] 跳过 release 的 lintVital 阻断（本应用有意使用隐藏 API 反射）
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'BlockedPrivateApi'
    }
}

dependencies {
    // [原生 UI] AppCompat + Material Components
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.annotation:annotation:1.6.0'
    // [新增] Kotlin 与协程核心支持，用于重构高并发音视频队列
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}